<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>노래방 7번 룸 튜토리얼</title>

<style>
/* Layout: 단계 칩 + 한 장의 무대. 무대 안에는 노래방 일러스트(SVG)나 유리 패널이 한 번에 하나만 뜬다 */
:root {
  color-scheme: dark;
  --ground: #120c15;
  --ink: rgba(255,255,255,.96);
  --ink-2: rgba(255,255,255,.66);
  --ink-3: rgba(255,255,255,.4);
  --glass: rgba(92,70,112,.46);
  --glass-edge: rgba(255,255,255,.36);
  --chip: rgba(255,255,255,.13);
  --sign: #FFD815;
  --blood: #c4352b;
  --good: #7cc58f;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--ground);
  color: var(--ink);
  font-family: var(--font);
  -webkit-font-smoothing: antialiased;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 28px;
}
.wrap { max-width: 1180px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }

/* 상단 단계 칩 */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.case { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.case small { font-size: 12px; letter-spacing: .06em; color: var(--ink-3); }
.case b { font-size: 17px; font-weight: 600; }
.steps { display: flex; gap: 6px; flex-wrap: wrap; list-style: none; margin: 0; padding: 0; }
.steps li { font-size: 12.5px; padding: 6px 11px; border-radius: 999px; background: var(--chip); color: var(--ink-3); display: flex; align-items: center; gap: 6px; white-space: nowrap; }
.steps li .n { font-variant-numeric: tabular-nums; opacity: .8; }
.steps li.done { color: var(--ink-2); }
.steps li.done .n::before { content: "✓ "; color: var(--good); }
.steps li.now { background: var(--ink); color: #1a1220; font-weight: 600; }
.steps li.locked::after { content: ""; width: 7px; height: 9px; border: 1.5px solid currentColor; border-radius: 2px; opacity: .6; }

/* 무대 */
.stage { position: relative; width: 100%; border-radius: 28px; overflow: hidden; background: #1a1220; aspect-ratio: 16 / 9; box-shadow: 0 0 0 1px rgba(255,255,255,.08); }
.frame { position: absolute; inset: 0; }
.frame > svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; user-select: none; -webkit-user-select: none; }
.frame svg text { font-family: var(--font); }

/* 유리 요소 */
.glass { background: var(--glass); -webkit-backdrop-filter: blur(28px) saturate(1.35); backdrop-filter: blur(28px) saturate(1.35); border: 1px solid var(--glass-edge); }
.tooltip { position: absolute; left: 50%; top: 18px; transform: translateX(-50%); border-radius: 999px; padding: 10px 22px; font-size: 16px; font-weight: 500; max-width: calc(100% - 32px); text-align: center; text-wrap: balance; pointer-events: none; }
.tooltip .count { color: var(--ink-2); margin-left: 6px; font-variant-numeric: tabular-nums; }
.toast { position: absolute; left: 50%; bottom: 22px; transform: translate(-50%, 8px); opacity: 0; border-radius: 999px; padding: 9px 18px; font-size: 14.5px; pointer-events: none; transition: opacity .2s, transform .2s; max-width: calc(100% - 32px); text-align: center; text-wrap: balance; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.card { position: absolute; left: 50%; bottom: 22px; transform: translateX(-50%); width: min(720px, calc(100% - 32px)); border-radius: 40px; padding: 26px 32px; display: flex; align-items: center; gap: 28px; animation: rise .35s ease-out; }
.card .txt { display: flex; flex-direction: column; gap: 8px; min-width: 0; flex: 1; }
.card h2 { margin: 0; font-size: 21px; font-weight: 600; text-wrap: balance; }
.card p { margin: 0; font-size: 15px; line-height: 1.55; color: var(--ink-2); }
.card .why { color: var(--ink); }
@keyframes rise { from { opacity: 0; transform: translate(-50%, 12px); } to { opacity: 1; transform: translate(-50%, 0); } }

.btn { font: inherit; font-size: 15.5px; font-weight: 600; border: 0; cursor: pointer; border-radius: 999px; padding: 14px 26px; white-space: nowrap; background: #fff; color: #1a1220; transition: transform .12s, opacity .2s; }
.btn:hover { transform: translateY(-1px); }
.btn:focus-visible { outline: 3px solid var(--sign); outline-offset: 3px; }
.btn.quiet { background: rgba(255,255,255,.16); color: var(--ink); }
.btn:disabled { opacity: .35; cursor: not-allowed; transform: none; }

/* SVG 안의 누를 수 있는 것 */
[data-hit], [data-decoy] { cursor: pointer; }
[data-hit]:focus, [data-decoy]:focus { outline: none; }
.ring .halo { fill: none; stroke: rgba(255,255,255,.85); stroke-width: 10; }
.ring .core { fill: none; stroke: #17111d; stroke-width: 3.5; }
.ring.on-dark .halo { stroke: rgba(255,255,255,.28); stroke-width: 14; }
.ring.on-dark .core { stroke: #fff; }
.ring { transform-box: fill-box; transform-origin: center; animation: ring 1.6s ease-in-out infinite; }
@keyframes ring { 0%,100% { transform: scale(1); } 50% { transform: scale(1.14); } }
.hinting .ring .core { stroke: #ff9500; }
.hinting .ring { animation-duration: .8s; }
[data-hit]:focus-visible .ring .core { stroke: #ff9500; }
[data-hit].hit .ring { animation: none; }
[data-hit].hit .ring .core { stroke: #2f9e57; }

.sbox { fill: rgba(255,255,255,.001); stroke: rgba(28,20,40,.78); stroke-width: 2.5; transition: stroke .2s, fill .2s; }
[data-hit]:hover .sbox, [data-decoy]:hover .sbox { stroke: #4a3bd8; }
[data-hit]:focus-visible .sbox { stroke: #ff9500; stroke-width: 4; }
.hinting [data-hit]:not(.hit) .sbox { stroke: #ff9500; stroke-width: 4.5; animation: blink .8s ease-in-out infinite; }
@keyframes blink { 50% { stroke-opacity: .35; } }
[data-hit].hit .sbox { stroke: #2f9e57; stroke-width: 4; fill: rgba(47,158,87,.14); }
.check { opacity: 0; }
[data-hit].hit .check { opacity: 1; }
[data-decoy].nope .sbox { animation: nope .5s; }
@keyframes nope { 0%,100% { stroke: rgba(28,20,40,.78); } 20%,60% { stroke: #e0352b; stroke-width: 4.5; } }

.sel { fill: rgba(86,64,230,.12); stroke: #3b2fd1; stroke-width: 3; }
.guide { opacity: 0; transition: opacity .4s; pointer-events: none; }
.guide.show { opacity: 1; }
.guide rect.g { fill: none; stroke: #ff9500; stroke-width: 4; stroke-dasharray: 14 10; animation: march 1s linear infinite; }
@keyframes march { to { stroke-dashoffset: -24; } }
.range-area, .draw-area { cursor: crosshair; touch-action: none; }

/* 끌어서 붙이는 스티커 */
.drag { cursor: grab; transform-box: view-box; transform-origin: 0 0; touch-action: none; }
.drag.dragging { cursor: grabbing; }
.drag.settle { transition: transform .35s cubic-bezier(.3,.7,.3,1); }
.drag:focus { outline: none; }
.drag:focus-visible .ring .core { stroke: #ff9500; }
.drag.placed { cursor: default; }
.drag.placed .ring { display: none; }
.bx.good.hit .sbox { stroke: #2f9e57; stroke-width: 4; fill: rgba(47,158,87,.14); }
.hinting .bx.good:not(.hit) .sbox { stroke: #ff9500; stroke-width: 4.5; animation: blink .8s ease-in-out infinite; }
.bx.nope .sbox { animation: nope .5s; }
.fit { fill: none; stroke: #3b2fd1; stroke-width: 4; }
.mres { opacity: 0; transition: opacity .4s; }
.mres.on { opacity: 1; }

.draw { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 1s ease-out forwards; animation-delay: var(--d, 0s); }
@keyframes draw { to { stroke-dashoffset: 0; } }
.later { opacity: 0; transition: opacity .5s; }
.revealed .later { opacity: 1; }
.measure { opacity: 0; }
.revealed .measure { animation: fadeIn .5s ease-out both; animation-delay: var(--d, 0s); }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

/* 전체 화면 패널 (BPA 소개, 브리핑, 보고서) */
.panel-bg { position: absolute; inset: 0; background: url('img/room.webp') center / cover no-repeat; filter: blur(10px) brightness(.4) saturate(1.1); transform: scale(1.08); }
.stage.has-panel { aspect-ratio: auto; min-height: 600px; }
.panel { position: relative; display: grid; place-items: center; padding: 40px 24px; min-height: 600px; }
.sheet { width: min(780px, 100%); border-radius: 40px; padding: 32px 36px; display: flex; flex-direction: column; gap: 18px; animation: fade .4s ease-out; }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
.eyebrow { font-size: 12px; letter-spacing: .08em; color: var(--ink-3); }
.sheet h1 { margin: 0; font-size: 30px; font-weight: 700; line-height: 1.25; text-wrap: balance; }
.sheet p { margin: 0; font-size: 15.5px; line-height: 1.6; color: var(--ink-2); max-width: 62ch; }
.sheet p b { color: var(--ink); font-weight: 600; }
.facts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.fact { background: rgba(255,255,255,.08); border-radius: 18px; padding: 12px 14px; display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.fact small { font-size: 12px; color: var(--ink-3); }
.fact b { font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; }
.fact span { font-size: 13px; color: var(--ink-2); line-height: 1.45; }
.row { display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; align-items: center; }
.diagram { background: rgba(0,0,0,.22); border-radius: 22px; padding: 10px 6px 4px; }
.diagram svg { width: 100%; height: auto; display: block; }
.diagram text { font-family: var(--font); }

/* 브리핑: 인물 + 말풍선 */
.talk { width: min(1000px, 100%); display: grid; grid-template-columns: minmax(0, .8fr) minmax(0, 1.25fr); gap: 28px; align-items: end; animation: fade .4s ease-out; }
.figure { position: relative; display: flex; justify-content: center; }
.figure svg { width: 100%; max-width: 340px; height: auto; display: block; }
.say { display: flex; flex-direction: column; gap: 14px; padding-bottom: 28px; }
.who { align-self: flex-start; font-size: 13px; font-weight: 600; padding: 6px 13px; border-radius: 999px; background: rgba(255,255,255,.14); }
.who small { font-weight: 400; color: var(--ink-2); margin-left: 6px; }
.bubble { position: relative; border-radius: 34px; padding: 26px 30px; min-height: 140px; display: flex; flex-direction: column; gap: 12px; }
.bubble::before { content: ""; position: absolute; left: -11px; bottom: 34px; width: 22px; height: 22px; transform: rotate(45deg); background: inherit; border-left: 1px solid var(--glass-edge); border-bottom: 1px solid var(--glass-edge); -webkit-backdrop-filter: inherit; backdrop-filter: inherit; }
.line { font-size: 20px; line-height: 1.55; margin: 0; text-wrap: pretty; animation: fade .35s ease-out; }
.line em { font-style: normal; color: var(--sign); }
.dots { display: flex; gap: 6px; }
.dots i { width: 7px; height: 7px; border-radius: 50%; background: rgba(255,255,255,.25); }
.dots i.on { background: #fff; }
.mission { border-radius: 22px; padding: 14px 18px; background: rgba(255,216,21,.12); border: 1px solid rgba(255,216,21,.35); font-size: 15px; line-height: 1.55; animation: fade .4s ease-out; }

/* 보고서 */
.report { display: flex; flex-direction: column; gap: 14px; }
.field { display: grid; grid-template-columns: 130px minmax(0, 1fr); gap: 12px; align-items: start; }
.field > span { font-size: 13.5px; color: var(--ink-3); padding-top: 9px; }
.auto { background: rgba(255,255,255,.07); border-radius: 14px; padding: 9px 12px; font-size: 14.5px; }
.auto::after { content: "자동 입력"; margin-left: 8px; font-size: 11px; color: var(--ink-3); }
.choices { display: flex; gap: 8px; flex-wrap: wrap; }
.choice { font: inherit; font-size: 14.5px; cursor: pointer; border-radius: 999px; padding: 9px 16px; background: rgba(255,255,255,.1); color: var(--ink); border: 1px solid transparent; }
.choice[aria-pressed="true"] { background: #fff; color: #1a1220; font-weight: 600; }
.choice:focus-visible { outline: 3px solid var(--sign); outline-offset: 2px; }
.mine { color: var(--sign); font-size: 11.5px; letter-spacing: .04em; }

/* 재연 */
.stage.has-replay { aspect-ratio: auto; background: #140c18; display: flex; flex-direction: column; align-items: center; padding-bottom: 22px; }
.replay { position: relative; width: 100%; height: clamp(260px, 40vw, 470px); }
.replay svg { width: 100%; height: 100%; display: block; }
.replay text { font-family: var(--font); }
.verdict { position: relative; margin-top: -40px; width: min(760px, calc(100% - 32px)); border-radius: 40px; padding: 26px 30px; display: flex; flex-direction: column; gap: 12px; opacity: 0; transition: opacity .6s; }
.verdict.show { opacity: 1; }
.verdict h2 { margin: 0; font-size: 22px; }
.verdict ul { margin: 0; padding: 0; list-style: none; display: flex; flex-wrap: wrap; gap: 8px; }
.verdict li { font-size: 13.5px; border-radius: 999px; padding: 6px 12px; background: rgba(255,255,255,.1); }
.verdict li.ok::before { content: "✓ "; color: var(--good); }
.verdict li.no::before { content: "✗ "; color: #ff8a7a; }
#arm { transform-origin: 404px 214px; transform-box: view-box; }
.play #arm { animation: swing 1.1s cubic-bezier(.5,0,.2,1) .6s both; }
@keyframes swing { 0% { transform: rotate(-150deg); } 70% { transform: rotate(10deg); } 100% { transform: rotate(4deg); } }
.drop { opacity: 0; }
.play .drop { animation: fly .55s ease-out both; animation-delay: calc(1.35s + var(--d)); }
@keyframes fly { 0% { opacity: 1; transform: translate(0,0); } 100% { opacity: 1; transform: translate(var(--dx), var(--dy)); } }
.stain { opacity: 0; }
.play .stain { animation: fadeIn .2s both; animation-delay: calc(1.85s + var(--d)); }
.origin-mark { opacity: 0; }
.play .origin-mark { animation: fadeIn .5s 2.6s both; }

.note { font-size: 12.5px; color: var(--ink-3); line-height: 1.55; margin: 0; }

@media (max-width: 760px) {
  .stage { aspect-ratio: auto; }
  .stage.scene .frame { position: relative; aspect-ratio: 16 / 9; }
  .stage.scene .tooltip { position: relative; left: auto; top: auto; transform: none; margin: 12px; max-width: none; border-radius: 22px; font-size: 14.5px; padding: 10px 14px; }
  .toast { bottom: 10px; font-size: 13px; padding: 7px 12px; }
  .stage .card, .stage .verdict { position: relative; left: auto; bottom: auto; transform: none; width: auto; margin: 12px; border-radius: 28px; flex-direction: column; align-items: stretch; gap: 16px; padding: 22px; animation: none; }
  .verdict { margin-top: 0; opacity: 1; }
  .stage.has-panel, .panel { min-height: 0; }
  .panel { padding: 16px 12px; }
  .facts { grid-template-columns: 1fr; }
  .field { grid-template-columns: 1fr; gap: 6px; }
  .field > span { padding-top: 0; }
  .sheet { padding: 24px 20px; border-radius: 28px; }
  .sheet h1 { font-size: 23px; }
  .talk { grid-template-columns: 1fr; gap: 6px; }
  .figure svg { max-width: 170px; }
  .say { padding-bottom: 0; }
  .bubble { padding: 20px 22px; border-radius: 26px; min-height: 0; }
  .bubble::before { left: 50%; top: -11px; bottom: auto; margin-left: -11px; border-left: 1px solid var(--glass-edge); border-top: 1px solid var(--glass-edge); border-bottom: 0; }
  .line { font-size: 17px; }
}
@media (prefers-reduced-motion: reduce) {
  .ring, .card, .sheet, .talk, .line, .guide rect.g { animation: none !important; }
  .draw { animation-duration: .01s !important; animation-delay: 0s !important; }
  .play #arm, .play .drop, .play .stain, .play .origin-mark { animation-duration: .01s !important; animation-delay: 0s !important; }
}
</style>

<div class="wrap">
  <header class="top">
    <div class="case">
      <small>사건 파일 1107 · 튜토리얼 프로토타입</small>
      <b>노래방 7번 룸 사건</b>
    </div>
    <ol class="steps" id="steps" aria-label="진행 단계"></ol>
  </header>
  <main class="stage" id="stage" aria-live="polite"></main>
  <p class="note">노래방 장면은 팀이 공유한 무드 이미지(보라 벨벳 소파, 검은 대리석)를 참고해 그린 임시 일러스트예요. 방 전체가 어두우면 피가 묻혀 안 보여서, 피가 튄 벽만 밝은 대리석 패널로 바꿨어요. 한 단계에 한 가지만 할 수 있고, 다른 곳을 누르면 안내가 떠요.</p>
</div>

<script>
/* ---------- 혈흔 데이터 (벽 확대 장면, 1600×900 좌표) ---------- */
const C = { x: 760, y: 600 };                 // 줄이 모이는 점 (벽 위)
const BLOOD = '#76101a';
const rad = d => d * Math.PI / 180;
const tailDir = a => Math.atan2(Math.cos(rad(a)), -Math.sin(rad(a))) * 180 / Math.PI; // 꼬리가 바깥을 보도록 회전

const MAIN = [
  { id: 'g1', r: 445, a: -115, t: 'good', L: 46, alpha: 34 },
  { id: 'g2', r: 345, a: -58,  t: 'good', L: 42, alpha: 41 },
  { id: 'g3', r: 234, a: -162, t: 'good', L: 38, alpha: 52 },
  { r: 300, a: -90,  t: 'small', L: 12 },
  { r: 390, a: -80,  t: 'small', L: 10 },
  { r: 262, a: -128, t: 'overlap', L: 28 },
  { r: 185, a: -38,  t: 'round', L: 20 },
  { r: 420, a: -40,  t: 'small', L: 11 },
  { r: 205, a: -100, t: 'small', L: 9 },
  { r: 150, a: -142, t: 'small', L: 10 },
  { r: 340, a: -148, t: 'small', L: 12 },
  { r: 275, a: -14,  t: 'overlap', L: 24 },
  { r: 120, a: -72,  t: 'round', L: 15 },
  { r: 470, a: -70,  t: 'small', L: 12 },
  { r: 230, a: -62,  t: 'small', L: 10 }
].map((s, i) => ({
  ...s, id: s.id || 'm' + i,
  x: C.x + s.r * Math.cos(rad(s.a)), y: C.y + s.r * Math.sin(rad(s.a)),
  phi: tailDir(s.a),
  W: s.t === 'good' ? s.L * Math.sin(rad(s.alpha)) : s.t === 'round' ? s.L : s.L * .6
}));

// 흉기를 휘두를 때 떨어진 다른 무리 (오른쪽 위 호)
const CAST = Array.from({ length: 8 }, (_, k) => {
  const a = -158 + k * 8, cx = 1520, cy = 430, R = 310;
  return { id: 'c' + k, t: 'small', L: 13 - (k % 3) * 2, x: cx + R * Math.cos(rad(a)), y: cy + R * Math.sin(rad(a)), phi: a + 180, W: 6 };
});

let seed = 11;
const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const MIST = Array.from({ length: 56 }, () => {
  const r = 70 + rnd() * 430, a = -176 + rnd() * 172;
  return { x: C.x + r * Math.cos(rad(a)), y: C.y + r * Math.sin(rad(a)), s: .9 + rnd() * 1.6 };
}).filter(p => p.y < 760);

const BBOX = (() => {
  const xs = MAIN.flatMap(s => [s.x - s.L * .7, s.x + s.L * .7]), ys = MAIN.flatMap(s => [s.y - s.L * .7, s.y + s.L * .7]);
  return { x: Math.min(...xs), y: Math.min(...ys), x2: Math.max(...xs), y2: Math.max(...ys) };
})();

function drop(s, fill = BLOOD) {
  const { x, y, L, W, phi, t } = s;
  if (t === 'round') return `<circle cx="${x}" cy="${y}" r="${L / 2}" fill="${fill}"/>`;
  let body = `<ellipse rx="${W / 2}" ry="${L / 2}" fill="${fill}"/>` +
    `<path d="M ${-W * .24} ${-L * .3} Q 0 ${-L * 1.1} ${W * .24} ${-L * .3} Z" fill="${fill}"/>`;
  if (t === 'good') body += `<circle cx="0" cy="${-L * 1.05}" r="${Math.max(1.6, W * .1)}" fill="${fill}"/>`;
  if (t === 'overlap') body += `<g transform="translate(${W * .55} ${L * .18}) rotate(32)"><ellipse rx="${W * .5}" ry="${L * .42}" fill="${fill}"/><path d="M ${-W * .2} ${-L * .28} Q 0 ${-L * .9} ${W * .2} ${-L * .28} Z" fill="${fill}"/></g>`;
  return `<g transform="translate(${x.toFixed(1)} ${y.toFixed(1)}) rotate(${phi.toFixed(1)})">${body}</g>`;
}

function stainBox(s) {
  const half = s.t === 'round' ? s.L / 2 + 10 : s.L * .72 + (s.t === 'overlap' ? 14 : 9);
  const off = s.t === 'round' ? 0 : s.L * .18;
  const cx = s.x + Math.sin(rad(s.phi)) * off, cy = s.y - Math.cos(rad(s.phi)) * off;
  return { x: cx - half, y: cy - half, w: half * 2, h: half * 2 };
}

const ring = (cx, cy, r, dark = false) =>
  `<g class="ring ${dark ? 'on-dark' : ''}"><circle class="halo" cx="${cx}" cy="${cy}" r="${r}"/><circle class="core" cx="${cx}" cy="${cy}" r="${r}"/></g>`;

const allStains = (dimExcept) => {
  const mist = MIST.map(p => `<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="${p.s.toFixed(2)}" fill="${BLOOD}"/>`).join('');
  const main = MAIN.map(s => drop(s)).join('');

  return `<g ${dimExcept ? 'opacity=".28"' : ''}>${mist}${main}${cast}</g>`;
};

/* ---------- 노래방 전체 장면 ---------- */
function roomSVG() {
  // 왼쪽 벽: 위 y = 170x/420, 아래 y = 900 - 340x/420 (오른쪽은 좌우 반전)
  const top = x => 170 * x / 420, bot = x => 900 - 340 * x / 420;
  const sidePanel = (x0, x1, flip, fill) => {
    const h0 = bot(x0) - top(x0), h1 = bot(x1) - top(x1);
    const pts = [[x0, top(x0) + h0 * .1], [x1, top(x1) + h1 * .1], [x1, top(x1) + h1 * .5], [x0, top(x0) + h0 * .5]]
      .map(([x, y]) => `${flip ? 1600 - x : x},${y.toFixed(1)}`).join(' ');
    return `<polygon points="${pts}" fill="${fill}" stroke="#a5844c" stroke-width="2.5"/>`;
  };
  const leftPanels = [[30, 120], [150, 240], [265, 345], [365, 410]].map(([a, b]) => sidePanel(a, b, false, 'url(#mirror)')).join('');
  const rightPanels = [[30, 120], [150, 240], [265, 345], [365, 410]].map(([a, b]) => sidePanel(a, b, true, 'url(#bronze)')).join('');
  const candles = Array.from({ length: 9 }, (_, k) => {
    const i = k - 4, x = 800 + i * 34, y = 118 + Math.abs(i) * 4;
    return `<rect x="${x - 2.5}" y="${y - 18}" width="5" height="18" fill="#f3eadb"/><circle cx="${x}" cy="${y - 23}" r="4.5" fill="#ffd27a"/>`;
  }).join('');
  const crystals = Array.from({ length: 13 }, (_, k) => {
    const x = 736 + k * 10.7;
    return `<line x1="${x}" y1="${130 + Math.abs(k - 6) * 2}" x2="${x}" y2="${148 + (6 - Math.abs(k - 6)) * 4}" stroke="#fff3d6" stroke-opacity=".7" stroke-width="2"/>`;

  const tufts = (y0, n) => Array.from({ length: n }, (_, k) => `<circle cx="${452 + k * 38}" cy="${y0}" r="3" fill="#2a1040"/>`).join('');

  let sd = 5; const r2 = () => (sd = (sd * 16807) % 2147483647) / 2147483647;

    if (x < 992 || x > 1150 || y < 205 || y > 432) return '';
    return drop({ x, y, L, W: L * .62, phi: tailDir(a), t: L > 9 ? 'good' : 'small' }, '#7a0f18');

      <linearGradient id="rw" x1="1" y1="0" x2="0" y2="0"><stop offset="0" stop-color="#0f0913"/><stop offset="1" stop-color="#1f1427"/></linearGradient>

/* ---------- 측면 단면 (발혈 위치) ---------- */
const FLOOR = 830, SC = 480, WALLX = 1240;
const O = { x: WALLX - .30 * SC, y: FLOOR - 1.10 * SC };
const sideStains = [34, 41, 52].map(al => ({ al, y: FLOOR - (1.10 + .30 / Math.tan(rad(al))) * SC }));
function sideSVG() {
  const strings = sideStains.map((s, k) => {
    const ex = O.x + (O.x - WALLX) * .45, ey = O.y + (O.y - s.y) * .45;
    return `<line class="draw" pathLength="1" style="--d:${k * .25}s" x1="${WALLX}" y1="${s.y}" x2="${ex}" y2="${ey}" stroke="#ff3b30" stroke-width="3.5" stroke-linecap="round"/>`;
  }).join('');
  const ticks = [0.5, 1.0, 1.5].map(m => `<line x1="${WALLX}" y1="${FLOOR - m * SC}" x2="${WALLX + 22}" y2="${FLOOR - m * SC}" stroke="#4b4239" stroke-width="2"/><text x="${WALLX + 30}" y="${FLOOR - m * SC + 7}" font-size="20" fill="#4b4239">${m.toFixed(1)}m</text>`).join('');

    <rect width="1600" height="900" fill="url(#sg)"/>
    <rect x="0" y="${FLOOR}" width="1600" height="${900 - FLOOR}" fill="#09060b"/>
    <line x1="0" y1="${FLOOR}" x2="1600" y2="${FLOOR}" stroke="#c486ff" stroke-opacity=".35" stroke-width="2"/>

    <rect x="940" y="${FLOOR - .45 * SC}" width="${WALLX - 940}" height="${.45 * SC}" rx="20" fill="url(#sv)"/>

    <rect x="540" y="${FLOOR - .45 * SC}" width="320" height="26" rx="4" fill="#1d1622" stroke="#fff" stroke-opacity=".15"/>
    <rect x="580" y="${FLOOR - .45 * SC + 26}" width="240" height="${.45 * SC - 26}" fill="#0f0b12"/>

const $stage = document.getElementById('stage');
const $steps = document.getElementById('steps');
let current = 0, hits = new Set(), solved = false, hintTimer = null, toastTimer = null;
const picks = {};

function renderSteps() {
  $steps.innerHTML = STEPS.map((s, i) => {
    const cls = i < current ? 'done' : i === current ? 'now' : 'locked';
    return `<li class="${cls}" ${i === current ? 'aria-current="step"' : ''}><span class="n">${i + 1}</span>${s.label}</li>`;
  }).join('');
}

function go(i) {
  current = i; hits = new Set(); taken = new Set(); solved = false; clearTimeout(hintTimer);
  renderSteps();
  const s = STEPS[i];
  $stage.className = 'stage';
  ({ intro: renderIntro, brief: () => renderBrief(0, 0), report: renderReport, replay: renderReplay }[s.key] || renderScene)(s);
}

function renderScene(s) {
  $stage.classList.add('scene');
  $stage.innerHTML = `<div class="frame">${s.build()}<div class="toast glass" id="toast" role="status"></div></div>
    <div class="tooltip glass" id="tip">${s.tip}${s.need > 1 ? `<span class="count" id="count">0 / ${s.need}</span>` : ''}</div>`;
  const svg = $stage.querySelector('svg');
  if (s.range) setupRange(s, svg);
  if (s.drop) setupDrag(s, svg);
  if (s.ellipse) setupEllipse(s, svg);
  hintTimer = setTimeout(() => {
    if (solved) return;
    $stage.classList.add('hinting');
    s.onHint ? s.onHint() : showGuide();
    if (s.hint) toast(s.hint, 3600);
  }, s.range ? 8000 : 9000);
}

function toast(msg, ms = 2600) {
  const t = document.getElementById('toast'); if (!t) return;
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), ms);
}
const showGuide = (id = 'guide') => document.getElementById(id)?.classList.add('show');
const hideGuide = (id = 'guide') => document.getElementById(id)?.classList.remove('show');
const svgPt = (svg, e) => { const p = svg.createSVGPoint(); p.x = e.clientX; p.y = e.clientY; return p.matrixTransform(svg.getScreenCTM().inverse()); };
// 그린 모양이 정답 크기로 맞춰지는 애니메이션
function tween(el, to, ms = 340) {
  const from = {}; for (const k in to) from[k] = parseFloat(el.getAttribute(k)) || 0;
  const t0 = performance.now();
  const step = now => {
    const t = Math.min(1, (now - t0) / ms), k2 = 1 - Math.pow(1 - t, 3);
    for (const k in to) el.setAttribute(k, from[k] + (to[k] - from[k]) * k2);
    if (t < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

function progress(s, key) {
  hits.add(key);
  const c = document.getElementById('count'); if (c) c.textContent = `${hits.size} / ${s.need}`;
  if (hits.size < s.need) return;
  solved = true; clearTimeout(hintTimer); $stage.classList.remove('hinting');
  $stage.querySelectorAll('.guide.show').forEach(g => g.classList.remove('show'));
  const wait = s.onHit ? s.onHit($stage.querySelector('svg')) : (s.wait || 450);
  setTimeout(() => solve(s), wait);
}

// 점 누르기 (줄 연결, 발혈 위치): 틀리면 동그라미 가이드
$stage.addEventListener('click', e => {
  const s = STEPS[current];
  if (!s.point || solved) return;
  if (e.target.closest('.card, .tooltip')) return;
  const svg = e.target.closest('svg'); if (!svg) return;
  const p = svgPt(svg, e);
  if (Math.hypot(p.x - s.point.x, p.y - s.point.y) <= s.point.tol) {
    hideGuide();
    svg.insertAdjacentHTML('beforeend', `<circle cx="${s.point.x}" cy="${s.point.y}" r="42" fill="none" stroke="#2f9e57" stroke-width="5"/><circle cx="${s.point.x}" cy="${s.point.y}" r="7" fill="#2f9e57"/>`);
    progress(s, 'p');
  } else {
    toast(s.miss, 3000); showGuide();
  }
});

function solve(s) {
  solved = true; clearTimeout(hintTimer);
  $stage.classList.remove('hinting');
  document.getElementById('tip')?.remove();
  document.getElementById('toast')?.classList.remove('show');
  const card = document.createElement('div');
  card.className = 'card glass';
  card.innerHTML = `<div class="txt"><h2>${s.done.title}</h2><p>${s.done.msg}</p><p class="why">${s.done.why}</p></div>
    <button class="btn" id="next">다음 단계</button>`;
  $stage.appendChild(card);
  const btn = card.querySelector('#next'); btn.focus({ preventScroll: true });
  btn.addEventListener('click', ev => { ev.stopPropagation(); go(current + 1); });
}

/* ---------- 스티커 끌어서 붙이기 ---------- */
function setupDrag(s, svg) {
  svg.querySelectorAll('[data-drag]').forEach(el => {
    const home = { x: +el.dataset.x, y: +el.dataset.y };
    let pos = home, grab = null;
    const place = (p, settle) => { el.classList.toggle('settle', !!settle); pos = p; el.style.transform = `translate(${p.x}px, ${p.y}px)`; };
    place(home);
    const drop = p => {
      const r = s.drop(el.dataset.drag, p);
      if (r.ok) {
        el.classList.add('placed'); el.setAttribute('tabindex', '-1');
        place(r.at, true);
        if (r.rot != null) el.querySelector('.arr')?.setAttribute('transform', `rotate(${r.rot.toFixed(1)})`);
        hideGuide();
        progress(s, el.dataset.drag);
      } else {
        place(home, true); toast(r.msg, 3200);
        s.onMiss ? s.onMiss() : showGuide();
      }
    };
    el.addEventListener('pointerdown', e => {
      if (solved || el.classList.contains('placed')) return;
      e.preventDefault(); e.stopPropagation();
      el.parentNode.appendChild(el);
      const p = svgPt(svg, e); grab = { dx: p.x - pos.x, dy: p.y - pos.y };
      el.setPointerCapture(e.pointerId); el.classList.add('dragging'); el.classList.remove('settle');
    });
    el.addEventListener('pointermove', e => { if (grab) { const p = svgPt(svg, e); place({ x: p.x - grab.dx, y: p.y - grab.dy }); } });
    el.addEventListener('pointerup', () => { if (!grab) return; grab = null; el.classList.remove('dragging'); drop(pos); });
    el.addEventListener('pointercancel', () => { grab = null; el.classList.remove('dragging'); place(home, true); });
    el.addEventListener('keydown', e => {
      if ((e.key === 'Enter' || e.key === ' ') && !el.classList.contains('placed') && !solved) { e.preventDefault(); drop(s.auto()); }
    });
  });
}

/* ---------- 범위 지정 (핀치 = 끌어서 네모) ---------- */
function setupRange(s, svg) {
  const sel = svg.querySelector('#sel');
  let start = null, box = null;
  const draw = (a, b) => {
    box = { x: Math.min(a.x, b.x), y: Math.min(a.y, b.y), x2: Math.max(a.x, b.x), y2: Math.max(a.y, b.y) };
    sel.setAttribute('x', box.x); sel.setAttribute('y', box.y);
    sel.setAttribute('width', box.x2 - box.x); sel.setAttribute('height', box.y2 - box.y);
  };
  svg.addEventListener('pointerdown', e => {
    if (solved) return;
    start = svgPt(svg, e); svg.setPointerCapture(e.pointerId);
    sel.setAttribute('visibility', 'visible'); draw(start, start);
  });
  svg.addEventListener('pointermove', e => { if (start && !solved) draw(start, svgPt(svg, e)); });
  svg.addEventListener('pointerup', () => {
    if (!start || solved) return; start = null;
    const w = box.x2 - box.x, h = box.y2 - box.y;
    if (w < 30 || h < 30) { sel.setAttribute('visibility', 'hidden'); return toast('누른 채로 끌어서 네모를 그려 보세요.'); }
    const inside = p => p.x >= box.x && p.x <= box.x2 && p.y >= box.y && p.y <= box.y2;
    const got = MAIN.filter(inside).length, cast = CAST.filter(inside).length;
    const ratio = (w * h) / ((BBOX.x2 - BBOX.x) * (BBOX.y2 - BBOX.y));
    let msg = null;
    if (cast > 0) msg = '오른쪽 위 피는 다른 순간에 튄 무리예요. 빼고 묶어 보세요.';
    else if (got < MAIN.length - 1) msg = `모인 피 ${MAIN.length}개 중 ${got}개만 들어왔어요. 조금 더 크게 잡아 보세요.`;
    else if (ratio > 2.6) msg = '범위가 너무 넓어요. 모여 있는 피에 맞게 좁혀 보세요.';
    if (msg) { sel.setAttribute('visibility', 'hidden'); toast(msg, 3200); setTimeout(() => showGuide(), 400); return; }
    tween(sel, { x: BBOX.x - 22, y: BBOX.y - 22, width: BBOX.x2 - BBOX.x + 44, height: BBOX.y2 - BBOX.y + 44 });
    progress({ ...s, need: 1 }, 'r');
  });
  svg.addEventListener('pointercancel', () => { start = null; sel.setAttribute('visibility', 'hidden'); });
}

/* ---------- 대표 혈흔에 동그라미 그리기 ---------- */
function setupEllipse(s, svg) {
  const de = svg.querySelector('#dE');
  let start = null, box = null;
  const set = (a, b) => {
    box = { cx: (a.x + b.x) / 2, cy: (a.y + b.y) / 2, rx: Math.abs(a.x - b.x) / 2, ry: Math.abs(a.y - b.y) / 2 };
    for (const k in box) de.setAttribute(k, box[k]);
  };
  svg.addEventListener('pointerdown', e => {
    if (solved) return;
    start = svgPt(svg, e); svg.setPointerCapture(e.pointerId);
    de.setAttribute('visibility', 'visible'); set(start, start);
  });
  svg.addEventListener('pointermove', e => { if (start && !solved) set(start, svgPt(svg, e)); });
  svg.addEventListener('pointerup', () => {
    if (!start || solved) return; start = null;
    const fail = (msg, z) => { de.setAttribute('visibility', 'hidden'); toast(msg, 3200); if (z) showGuide('gE' + z.i); };
    if (box.rx < 12 || box.ry < 12) return fail('누른 채로 끌어서 혈흔을 감싸는 동그라미를 그려 보세요.');
    const z = [...ZOOM].sort((a, b) => Math.hypot(box.cx - a.cx, box.cy - a.cy) - Math.hypot(box.cx - b.cx, box.cy - b.cy))[0];
    if (hits.has('e' + z.i)) return fail('이미 맞춘 혈흔이에요. 다른 혈흔에 그려 보세요.');
    if (Math.abs(box.cx - z.cx) > z.W * .45 || Math.abs(box.cy - z.cy) > z.L * .35) return fail('혈흔 몸통 위에 동그라미를 그려 보세요.', z);
    if (box.rx < z.W / 2 * .7 || box.ry < z.L / 2 * .7) return fail('동그라미가 혈흔보다 작아요. 몸통을 다 감싸 보세요.', z);
    if (box.rx > z.W / 2 * 1.9 || box.ry > z.L / 2 * 1.8) return fail('동그라미가 너무 커요. 혈흔 몸통에 맞춰 보세요.', z);
    // 성공: 그린 동그라미가 혈흔 몸통 크기로 맞춰진다
    de.setAttribute('visibility', 'hidden'); hideGuide('gE' + z.i);
    const fit = svg.querySelector('#fE' + z.i);
    for (const k in box) fit.setAttribute(k, box[k]);
    fit.setAttribute('visibility', 'visible');
    tween(fit, { cx: z.cx, cy: z.cy, rx: z.W / 2, ry: z.L / 2 });
    setTimeout(() => { svg.querySelector('#mr' + z.i).classList.add('on'); svg.querySelector('#formula').classList.add('on'); }, 300);
    progress(s, 'e' + z.i);
  });
  svg.addEventListener('pointercancel', () => { start = null; de.setAttribute('visibility', 'hidden'); });
}

      <div class="field"><span>대표 혈흔 충돌각</span><div class="auto">34° · 41° · 52°</div></div>
      <div class="field"><span>피가 튄 위치</span><div class="auto">벽에서 0.30m, 바닥에서 1.10m</div></div>
      ${field('weapon')}${field('posture')}${field('statement')}
    </div>
    <div class="row"><button class="btn" id="submit" disabled>보고서 제출하고 재연 보기</button></div>
  </section>`);
  const submit = document.getElementById('submit');
  const sync = () => { submit.disabled = Object.keys(ANSWERS).some(k => picks[k] === undefined); };
  $stage.querySelectorAll('.choice').forEach(b => b.addEventListener('click', () => {
    picks[b.dataset.key] = +b.dataset.k;
    $stage.querySelectorAll(`.choice[data-key="${b.dataset.key}"]`).forEach(x => x.setAttribute('aria-pressed', x === b));
    sync();
  }));
  sync();
  submit.addEventListener('click', () => go(current + 1));
}

/* ---------- 재연 ---------- */
function renderReplay() {
  $stage.classList.add('has-replay');
  const drops = [0, -40, 30, -70, 60, -15, 12];
  const right = Object.keys(ANSWERS).filter(k => picks[k] === ANSWERS[k].correct).length;
  $stage.innerHTML = `

      <rect x="470" y="268" width="168" height="40" rx="12" fill="url(#rv)"/>
      <rect x="600" y="196" width="38" height="184" rx="12" fill="url(#rv)"/>
      <rect x="470" y="300" width="168" height="80" rx="10" fill="#3a1752"/>
      <rect x="250" y="300" width="150" height="12" rx="3" fill="#1d1622"/><rect x="270" y="312" width="110" height="68" fill="#0f0b12"/>
      <g fill="rgba(255,255,255,.82)">
        <circle cx="560" cy="186" r="20"/>
        <rect x="544" y="208" width="32" height="64" rx="14"/>
        <rect x="500" y="262" width="66" height="20" rx="10"/>
        <rect x="496" y="262" width="18" height="78" rx="9"/>
      </g>
      <g fill="rgba(255,255,255,.45)">
        <circle cx="398" cy="150" r="21"/>
        <rect x="380" y="174" width="38" height="108" rx="16"/>
        <rect x="382" y="276" width="15" height="104" rx="7"/>
        <rect x="402" y="276" width="15" height="104" rx="7"/>
      </g>
      <g id="arm" fill="rgba(255,255,255,.45)">
        <rect x="400" y="206" width="104" height="15" rx="7.5"/>
        <rect x="498" y="196" width="46" height="13" rx="5" fill="#3f8a4f" opacity=".95"/>
      </g>
      ${drops.map((dy, k) => `<circle class="drop" cx="568" cy="184" r="${3 + (k % 3)}" fill="#a3161f" style="--dx:${70 + (k % 2) * 2}px;--dy:${dy}px;--d:${k * .04}s"/>`).join('')}
      ${drops.map((dy, k) => `<ellipse class="stain" cx="${643 + (k % 2)}" cy="${184 + dy}" rx="${3 + (k % 3)}" ry="${6 + (k % 3) * 2}" fill="${BLOOD}" style="--d:${k * .04}s"/>`).join('')}
      <g class="origin-mark">
        <circle cx="566" cy="184" r="30" fill="none" stroke="#ff3b30" stroke-width="2" stroke-dasharray="5 5"/>
        <text x="566" y="132" text-anchor="middle" font-size="14" fill="#fff">당신이 찾은 발혈 위치</text>
        <line x1="596" y1="184" x2="640" y2="184" stroke="#ff3b30" stroke-dasharray="3 4"/>
        <text x="618" y="176" text-anchor="middle" font-size="11" fill="rgba(255,255,255,.75)">0.30m</text>
      </g>
    </svg></div>
    <div class="verdict glass" id="verdict">
      <span class="eyebrow">재연 · 당신의 보고서 ${right} / 3 일치</span>
      <h2>친구의 진술은 거짓이었습니다</h2>
      <p style="margin:0;color:var(--ink-2);line-height:1.55;font-size:15px">피해자는 소파에 앉아 있었고, 친구가 위에서 병으로 내려쳤어요. 넘어져 테이블에 부딪혔다면 피는 바닥 가까이에서 튀었을 거예요. 벽에 남은 피가 그것을 알려 줬어요.</p>
      <ul>${Object.keys(ANSWERS).map(k => {
        const a = ANSWERS[k], ok = picks[k] === a.correct;
        return `<li class="${ok ? 'ok' : 'no'}">${a.q}: ${a.options[a.correct]}</li>`;
      }).join('')}</ul>
      <div class="row"><button class="btn quiet" id="again">재연 다시 보기</button><button class="btn" id="restart">처음부터</button></div>
    </div>`;
  const svg = $stage.querySelector('.replay');
  const play = () => { svg.classList.remove('play'); void svg.offsetWidth; svg.classList.add('play'); };

  setTimeout(() => document.getElementById('verdict')?.classList.add('show'), 3200);
  document.getElementById('again').addEventListener('click', play);
  document.getElementById('restart').addEventListener('click', () => { for (const k in picks) delete picks[k]; go(0); });
}

go(0);
</script>
